<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | The Hash Labs</title>
  <meta name="description" content="This page could not be found. Return to The Hash Labs homepage, browse our work, or get in touch with our Lahore-based IT team.">
  <meta name="robots" content="noindex, follow">
  <link rel="shortcut icon" href="/assets/logo/logo t.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #020617;
      --bg-mid: #0b1e3a;
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --sky: #7dd3fc;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(125, 211, 252, 0.28);
      --text: #f8fafc;
      --muted: rgba(226, 232, 240, 0.78);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "Raleway", sans-serif;
      color: var(--text);
      background: var(--bg-deep);
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.25rem;
      position: relative;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(34, 211, 238, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 75%, rgba(59, 130, 246, 0.28), transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(14, 165, 233, 0.12), transparent 60%),
        linear-gradient(135deg, #020617 0%, #0b1e3a 45%, #061229 100%);
      background-size: 200% 200%, 200% 200%, 100% 100%, 100% 100%;
      animation: gradientShift 14s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 40%, 100% 60%, 50% 50%, 0 0; }
      50% { background-position: 80% 20%, 20% 80%, 50% 50%, 0 0; }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: orbFloat 10s ease-in-out infinite;
    }

    .orb-a {
      width: 280px;
      height: 280px;
      background: var(--cyan);
      top: 8%;
      left: 6%;
    }

    .orb-b {
      width: 340px;
      height: 340px;
      background: var(--blue);
      bottom: 4%;
      right: 8%;
      animation-delay: -4s;
      animation-duration: 12s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(24px, -30px) scale(1.08); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
      margin-bottom: 2rem;
      transition: opacity 0.25s ease;
    }

    .brand:hover { opacity: 0.85; }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.45));
    }

    .brand span {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.02em;
      text-align: left;
    }

    .glass {
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
      border: 1px solid var(--glass-border);
      border-radius: 1.5rem;
      padding: 2.75rem 1.75rem 2.25rem;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .digits {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
      user-select: none;
    }

    .digit {
      font-size: clamp(4.5rem, 18vw, 7.5rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #e0f2fe 0%, var(--cyan) 45%, var(--blue) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(34, 211, 238, 0.25);
      animation: floatDigit 4.5s ease-in-out infinite;
    }

    .digit:nth-child(1) { animation-delay: 0s; }
    .digit:nth-child(2) { animation-delay: -1.4s; animation-duration: 5.2s; }
    .digit:nth-child(3) { animation-delay: -2.6s; animation-duration: 4.8s; }

    @keyframes floatDigit {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-18px) rotate(2deg); }
    }

    h1 {
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 700;
      margin-bottom: 0.65rem;
    }

    .msg {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
      max-width: 28rem;
      margin: 0 auto 1.75rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: center;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 650;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .links a:hover { transform: translateY(-2px); }

    .links a.primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #04101f;
      box-shadow: 0 8px 28px rgba(34, 211, 238, 0.35);
    }

    .links a.primary:hover {
      box-shadow: 0 12px 36px rgba(59, 130, 246, 0.45);
    }

    .links a.ghost {
      background: var(--glass);
      color: var(--sky);
      border: 1px solid var(--glass-border);
    }

    .links a.ghost:hover {
      background: rgba(125, 211, 252, 0.14);
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: rgba(148, 163, 184, 0.85);
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <main class="wrap">
    <a class="brand" href="/index.html">
      <img src="/assets/logo/logo t.png" alt="The Hash Labs logo">
      <span>The<br>Hash Labs</span>
    </a>

    <div class="glass">
      <div class="digits" aria-hidden="true">
        <span class="digit">4</span>
        <span class="digit">0</span>
        <span class="digit">4</span>
      </div>
      <h1>Page not found</h1>
      <p class="msg">
        The route you asked for isn’t on this server — it may have moved, or the URL might be mistyped.
        Let’s get you back into Hash Labs.
      </p>
      <nav class="links" aria-label="Helpful destinations">
        <a class="primary" href="/index.html">Home</a>
        <a class="ghost" href="/pages/work.html">Our Work</a>
        <a class="ghost" href="/pages/contact.html">Contact</a>
      </nav>
      <p class="hint">IT &amp; computer science · Lahore, Pakistan</p>
    </div>
  </main>
</body>
</html>
